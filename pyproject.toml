[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.2.0",
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "aiosqlite>=0.21",
]

[project.scripts]
aurora-restore = "aurora.restore:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
